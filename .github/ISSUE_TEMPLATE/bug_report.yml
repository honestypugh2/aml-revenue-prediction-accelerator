name: Bug report
description: Report a problem with the accelerator (offline/local behavior).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the accelerator. **Do not include any real
        data, secrets, subscription/tenant IDs, or customer information.** Use
        synthetic examples and placeholders only.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands (e.g. `uv run revenue-prediction ...`) and expected vs actual.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, uv version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Paste relevant output. Redact anything sensitive.
      render: shell
