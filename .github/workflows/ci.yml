name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test (offline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (core + dev + ui)
        run: uv sync --extra ui --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyright
        run: uv run pyright src

      - name: Customer-neutrality & secret scan
        run: uv run python scripts/verify_environment.py --neutrality-scan

      - name: Tests (exclude opt-in live)
        run: uv run pytest -m "not live" --cov=revenue_prediction --cov-report=term-missing

  bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep
        run: |
          az bicep install
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/bicep/quickstart.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/bicep/secure.bicepparam --stdout > /dev/null
