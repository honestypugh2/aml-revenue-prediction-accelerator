[project]
name = "revenue-prediction-accelerator"
version = "0.1.0"
description = "Reusable Azure Machine Learning accelerator for predicting healthcare facility net revenue from partial-month data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Revenue Prediction Accelerator Maintainers" }]
keywords = [
    "azure-machine-learning",
    "automl",
    "mlops",
    "forecasting",
    "healthcare",
    "net-revenue",
    "microsoft-fabric",
]

# Core runtime dependencies. These are intentionally lightweight and
# cloud-agnostic so the accelerator can run fully offline for local
# development, education, and workshops.
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4,<2.0",
    "xgboost>=2.0,<3.0",
    "pandera>=0.19,<0.24",
    "mlflow>=2.12,<3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "typer>=0.12,<0.16",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "polars>=1.43.0",
    "azure-ai-ml>=1.34.1",
    "azure-identity>=1.25.3",
]

[project.optional-dependencies]
# Azure Machine Learning SDK v2 integration (job submission, AutoML,
# registration, endpoints). Kept optional so core validation stays fast.
azure = [
    "azure-ai-ml>=1.16,<2.0",
    "azure-identity>=1.16,<2.0",
    "azureml-mlflow>=1.56",
    "mltable>=1.6",
]
# Microsoft Fabric / OneLake access via the ADLS Gen2 filesystem API.
fabric = [
    "azure-storage-file-datalake>=12.14",
    "azure-identity>=1.16,<2.0",
]
# API backend that serves the React educational UI over the Python core.
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
# SHAP explainability (educational UI, code-first, and offline analysis).
explain = [
    "shap>=0.44",
]
# ONNX model optimization / portable inference.
onnx = [
    "skl2onnx>=1.16",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
# Notebook execution.
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]
# OPTIONAL Azure AI Foundry integration. Not required by the core
# forecasting solution or the workshop. See docs/development/dependencies.md.
foundry = [
    "azure-ai-projects>=1.0.0b4",
    "azure-identity>=1.16,<2.0",
]

[dependency-groups]
# Development tooling (PEP 735 dependency group, installed by default by uv).
dev = [
    "ruff>=0.4,<0.9",
    "pyright>=1.1.360",
    "pytest>=8.1,<9.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.scripts]
revenue-prediction = "revenue_prediction.interfaces.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_prediction"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH"]
# N818: ContractViolation is an intentional, stable public API name.
ignore = ["N803", "N806", "E501", "N818"]

[tool.ruff.lint.per-file-ignores]
# B008: Typer uses function calls (Option/Argument) in defaults by design.
"src/revenue_prediction/interfaces/cli/**" = ["B008"]
"tests/**" = ["N802", "N803", "N806"]
"notebooks/**" = ["E402", "F401"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "notebooks"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingModuleSource = false
# The following categories are dominated by false positives from pandas' and
# numpy's dynamic inline typing (e.g. DataFrame.__getitem__ returning
# Series | DataFrame unions, Series arithmetic widening). They are disabled to
# keep type checking signal high; genuine checks (undefined variables, unbound
# locals, self/cls params, redeclarations, etc.) remain enabled. See
# docs/development/dependencies.md for the rationale.
reportArgumentType = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportOperatorIssue = false
reportReturnType = false
reportIndexIssue = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    # Benign: Starlette's TestClient warns about httpx; functionality is fine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
markers = [
    "unit: fast isolated unit tests",
    "contract: data-contract validation tests",
    "smoke: end-to-end offline smoke tests",
    "integration: tests that touch external systems (opt-in)",
    "ui: tests that exercise the framework-agnostic UI logic",
    "api: tests that exercise the FastAPI backend",
    "live: tests that require live Azure/Fabric credentials (opt-in)",
]
[tool.coverage.run]
source = ["revenue_prediction"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
