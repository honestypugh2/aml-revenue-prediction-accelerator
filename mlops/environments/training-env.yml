# Conda environment for Azure Machine Learning training/inference jobs.
# Mirrors the core runtime dependencies of the accelerator.
name: revenue-prediction-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24.0
  - pip:
      - numpy>=1.26,<3.0
      - pandas>=2.1,<3.0
      - pyarrow>=15.0
      - scikit-learn>=1.4,<2.0
      - xgboost>=2.0,<3.0
      - pandera>=0.19,<0.24
      - mlflow>=2.12,<3.0
      - azureml-mlflow>=1.56
      - pydantic>=2.6,<3.0
      - pydantic-settings>=2.2,<3.0
      - pyyaml>=6.0
