# Batch deployment for the registered champion model.
$schema: https://azuremlschemas.azureedge.net/latest/batchDeployment.schema.json
name: champion
endpoint_name: revenue-batch-endpoint
description: Champion net-revenue regression model (batch scoring).
model: azureml:revenue-net-revenue-model@latest
compute: azureml:cpu-cluster
resources:
  instance_count: 1
max_concurrency_per_instance: 2
mini_batch_size: 10
output_action: append_row
output_file_name: predictions.csv
retry_settings:
  max_retries: 3
  timeout: 300
error_threshold: 10
logging_level: info
